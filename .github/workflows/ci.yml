name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "fastapi>=0.111" \
            "uvicorn[standard]>=0.29" \
            "psycopg[binary,pool]>=3.1" \
            "python-dotenv>=1.0" \
            "pydantic>=2.0" \
            httpx \
            pytest \
            pytest-asyncio \
            anyio

      - name: Run tests
        run: python -m pytest tests/ -v
